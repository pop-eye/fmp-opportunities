events:
  - name: School of Digital Arts Events
    type: html
    url: https://www.mmu.ac.uk/about-us/faculties/arts-humanities/schools/school-of-digital-arts/events
    enabled: false
    rate_limit_seconds: 5.0
    notes: Manual browsing only. The university's website terms require express written permission to republish information.

  - name: HOME Manchester
    type: html
    url: https://homemcr.org/whats-on/
    enabled: false
    parser: fmp_opportunities.tools.events:parse_homemcr
    rate_limit_seconds: 5.0
    notes: Disabled by default because /whats-on/ returns HTTP 403 to automated requests.

  - name: Factory International
    type: html
    url: https://factoryinternational.org/whats-on/
    enabled: true
    parser: fmp_opportunities.tools.events:parse_factory_international
    rate_limit_seconds: 2.0
    notes: Public Whats On page at Aviva Studios, Manchester.

  - name: FACT Liverpool
    type: html
    url: https://www.fact.co.uk/whats-on
    enabled: false
    rate_limit_seconds: 5.0
    notes: Manual browsing only. FACT's terms restrict reproduction; confirm permission before automated import.

  - name: The Whitworth
    type: html
    url: https://www.whitworth.manchester.ac.uk/whats-on/
    enabled: false
    rate_limit_seconds: 5.0
    notes: Manual browsing only. Confirm permission and configure a parser before automated import.

  - name: Eventbrite Manchester Art
    type: html
    url: https://www.eventbrite.co.uk/d/united-kingdom--manchester/art/
    enabled: false
    rate_limit_seconds: 5.0
    notes: Manual browsing only. Eventbrite terms prohibit scraping and automated data extraction.

  - name: BEYOND Conference
    type: html
    url: https://tickets.beyondconference.org/events/beyond/
    enabled: true
    parser: fmp_opportunities.tools.events:parse_beyond_events
    rate_limit_seconds: 5.0
    notes: Public BEYOND ticket listings; robots.txt allows access. Check event details and availability on the source.

  - name: Royal Television Society Events
    type: html
    url: https://rts.org.uk/events
    enabled: true
    parser: fmp_opportunities.tools.events:parse_rts_events
    rate_limit_seconds: 2.0
    notes: robots.txt allows / (Content-Signal search=yes,use=reference). Broadcast, film, and TV industry talks, awards, and screenings.

  - name: Creative UK Events
    type: html
    url: https://www.wearecreative.uk/connect/events/
    enabled: true
    parser: fmp_opportunities.tools.events:parse_creative_uk_events
    rate_limit_seconds: 2.0
    notes: robots.txt allows /connect/events/. UK creative industry webinars, networking, and career events.

  - name: UKIE Events
    type: html
    url: https://ukie.org.uk/events
    enabled: true
    parser: fmp_opportunities.tools.events:parse_ukie_events
    rate_limit_seconds: 2.0
    notes: robots.txt allows /events. UK games and interactive media workshops, conferences, and networking.

  - name: Manchester Digital Events
    type: html
    url: https://www.manchesterdigital.com/events
    enabled: false
    parser: fmp_opportunities.tools.events:parse_manchester_digital
    rate_limit_seconds: 2.0
    notes: Disabled by default because event listings load client side via JavaScript.
