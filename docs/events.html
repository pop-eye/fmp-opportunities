<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMP Creative and Digital Events</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" data-tool="events" data-json="events.json">
    <header class="page-header">
      <h1>Creative and Digital Events</h1>
      <div class="meta-row">
        <span id="last-updated">Last updated: loading</span>
        <a href="events.xml">RSS Feed (events.xml)</a>
        <a href="events.ics">Calendar Feed (events.ics)</a>
      </div>
      <nav class="nav-links" aria-label="Opportunity feeds">
        <a href="index.html">Overview</a>
        <a href="jobs.html">Jobs</a>
        <a href="placements.html">Placements</a>
        <a href="events.html" aria-current="page">Events</a>
      </nav>
    </header>

    <main>
      <section class="controls" aria-label="Filter events">
        <div class="control-group">
          <label for="filter-search">Search keywords</label>
          <input id="filter-search" type="search" placeholder="Event, venue, topic">
        </div>
        <div class="control-group">
          <label for="filter-discipline">Discipline</label>
          <select id="filter-discipline">
            <option value="">All disciplines</option>
          </select>
        </div>
        <div class="control-group">
          <label for="filter-date-range">Date range</label>
          <select id="filter-date-range">
            <option value="all">All upcoming</option>
            <option value="7">Next 7 days</option>
            <option value="30">Next 30 days</option>
          </select>
        </div>
        <div class="control-group">
          <label for="filter-location">Location</label>
          <select id="filter-location">
            <option value="">All locations</option>
          </select>
        </div>
      </section>

      <p id="status-bar" class="status-bar" aria-live="polite">Loading events...</p>
      <ul id="listings" class="listings"></ul>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
