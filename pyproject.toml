[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmp-opportunities"
version = "0.1.0"
description = "Weekly opportunities feed generator for BA Future Media Production students at Manchester Metropolitan University."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "icalendar>=6.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
