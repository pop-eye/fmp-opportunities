# Relevance filtering terms and weights.
# Scores are summed across matching include terms in title, summary, tags, and organisation.
# Any item matching an exclude term is dropped.

global:
  min_score: 1.0
  include:
    video production: 2.0
    audio production: 2.0
    motion graphics: 2.0
    creative technology: 2.0
    post production: 2.0
    broadcast: 1.5
    content production: 1.5
    digital design: 1.5
    interactive media: 2.0
    games: 1.5
    ux: 1.5
    ui: 1.0
    creative producing: 2.0
    community media: 1.5
    video: 1.0
    audio: 1.0
    film: 1.0
    media: 0.8
    creative: 0.8
    digital: 0.8
    animation: 1.5
    motion: 1.0
    editing: 1.0
    editor: 1.0
    producer: 1.0
    production: 0.8
    social media: 1.5
    marketing: 1.0
    digital marketing: 1.5
    content marketing: 1.5
    branding: 1.0
    communications: 0.8
    runner: 1.5
    edit assistant: 2.0
    production assistant: 2.0
    camera: 1.2
    unreal: 1.5
    unity: 1.5
    3d: 1.2
    vfx: 1.5
    podcast: 1.5
    photography: 1.0
    sound: 1.0
    design: 0.8
    junior: 1.0
    graduate: 1.0
    trainee: 1.0
    assistant: 0.8
    entry level: 1.0
    manchester: 1.5
    north west: 1.0
    salford: 1.5
    media city: 1.5
  exclude:
    - senior
    - director
    - head of
    - principal
    - lead engineer
    - 5+ years
    - 10+ years
    - account executive
    - business development
    - recruitment
    - recruiter
    - accountant
    - solicitor
    - nurse
    - driver
    - warehouse
    - cleaning
    - chef

jobs:
  min_score: 1.0
  # A location, employer name, or generic word such as "digital" is not enough.
  # At least one of these must appear in the title or summary, or a title term below.
  required_any: &creative_role_terms
    - video
    - videographer
    - film
    - filming
    - camera
    - cinematography
    - photography
    - photographer
    - audio
    - sound
    - music
    - radio
    - podcast
    - broadcast
    - television
    - tv
    - motion graphics
    - motion design
    - motion designer
    - animation
    - animator
    - vfx
    - 3d
    - editing
    - editor
    - editorial
    - post production
    - post-production
    - media
    - content
    - social media
    - paid social
    - marketing
    - brand
    - branding
    - communications
    - copywriter
    - ux
    - ui
    - user experience
    - user interface
    - graphic design
    - graphic designer
    - digital design
    - digital designer
    - digital experience
    - web design
    - web designer
    - interactive
    - vr
    - ar
    - xr
    - mixed reality
    - game
    - games
    - gaming
    - unreal
    - unity
    - creative technology
    - creative production
    - community media
  required_title_any: &creative_title_terms
    - creative
    - artworker
    - artist
    - illustrator
    - producer
    - researcher

apprenticeships:
  # Required creative role evidence is the gate; titles need not say "apprentice"
  # when the official apprenticeship API has already identified the vacancy.
  min_score: 0.0
  required_any: *creative_role_terms
  required_title_any: *creative_title_terms
  include:
    apprentice: 1.0
    apprenticeship: 1.0

placements:
  min_score: 1.0
  include:
    placement: 1.5
    internship: 1.5
    sandwich year: 2.0
    year in industry: 2.0

events:
  min_score: 1.0
  include:
    festival: 1.5
    screening: 1.5
    workshop: 1.5
    networking: 1.5
    open call: 1.5
    competition: 1.5
    talk: 1.0
    conference: 1.5
    webinar: 1.2
    awards: 1.2
    showcase: 1.5
    tv: 1.0
    television: 1.2
